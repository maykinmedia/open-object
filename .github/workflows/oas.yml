name: OAS

on:
  push:
    branches:
      - master
      - stable/*
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  oas:
    name: Checks
    uses: maykinmedia/open-api-workflows/.github/workflows/oas.yml@776c60ffef1d34cbdee5a2402322cae6278ec237 # v7.0.1
    with:
      python-version: '3.12'
      apt-packages: 'gdal-bin'
      django-settings-module: objects.conf.ci
      oas-generate-command: ./bin/generate_schema.sh
      schema-path: src/objects/api/v2/openapi.yaml
      oas-artifact-name: open-object-oas
      node-version-file: '.nvmrc'
      openapi-to-postman-version: '^5.0.0'
      postman-artifact-name: open-object-postman-collection
      openapi-generator-version: '^2.20.0'
      spectral-ruleset: ruleset.yaml
      vacuum-custom-functions: vacuum_functions
