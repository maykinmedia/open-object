name: code-quality

on:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - '**.yml'
      - 'ruff.toml'
  pull_request:
    paths:
      - '**.py'
      - '**.yml'
      - 'ruff.toml'
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  open-api-workflow-code-quality:
    uses: maykinmedia/open-api-workflows/.github/workflows/code-quality.yml@0a5525c13f8eea10be40c8eaee5e535ea3a10721 # v6.4.1
    with:
      apt-packages: 'gdal-bin'
      python-version: '3.12'
      node-version: '24'
      postgres-image: 'postgis/postgis:17-3.5'
      django-settings-module: 'objects.conf.ci'
