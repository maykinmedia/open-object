name: code-quality

on:
  push:
    branches:
      - master
    paths:
      - '**.py'
      - '**.yml'
      - 'ruff.toml'
  pull_request:
    paths:
      - '**.py'
      - '**.yml'
      - 'ruff.toml'
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

jobs:
  open-api-workflow-code-quality:
    uses: maykinmedia/open-api-workflows/.github/workflows/code-quality.yml@776c60ffef1d34cbdee5a2402322cae6278ec237 # v7.0.1
    with:
      apt-packages: 'gdal-bin'
      python-version: '3.12'
      node-version: '26'
      postgres-image: 'postgis/postgis:17-3.5'
      django-settings-module: 'objects.conf.ci'
  
  type-checking:
    name: Type checking (Pyright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install additional dependencies
        run: |
          pip install uv
          uv pip install \
            --system \
            -r requirements/type-checking.txt
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: 1.1.407
          project: pyright.pyproject.toml
