name: ci

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

# least privilege as default, should be overridden per job if necessary
permissions:
  contents: read

env:
  IMAGE_NAME: maykinmedia/open-object

jobs:
  tests:
    strategy:
      matrix:
        postgres: ['14', '15', '16', '17']
        postgis: ['3.2', '3.5']
        use_pooling: [false]
        exclude:
          # postgis 3.2 is not compatible with recent postgres versions
          - postgres: '17'
            postgis: '3.2'
          - postgres: '16'
            postgis: '3.2'
          - postgres: '15'
            postgis: '3.2'
        include:
          - postgres: '17'
            postgis: '3.5'
            use_pooling: true

    name: Run the Django test suite (PG ${{ matrix.postgres }}, postgis ${{ matrix.postgis }}) ${{matrix.use_pooling && 'with connection pooling' || ''}}


    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgres }}-${{ matrix.postgis }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages: 'gdal-bin'
          python-version: '3.12'
          setup-node:  'yes'

      - name: Run Django tests (without Playwright)
        run: |
          rm -rf static
          python src/manage.py collectstatic --noinput --link
          coverage run src/manage.py test src --exclude-tag=playwright
        env:
          DJANGO_SETTINGS_MODULE: objects.conf.ci
          DEBUG: 'true'
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_PASSWORD: ''
          DB_POOL_ENABLED: ${{ matrix.use_pooling }}

          CELERY_BROKER_URL: 'redis://localhost:6379/0'
          CELERY_ONCE_REDIS_URL: 'redis://localhost:6379/0'

      - name: Install Playwright browsers
        if: ${{ matrix.postgres == '17' && matrix.postgis == '3.5' && matrix.use_pooling == false }}
        run: playwright install --with-deps chromium

      - name: Run Playwright tests
        if: ${{ matrix.postgres == '17' && matrix.postgis == '3.5' && matrix.use_pooling == false }}
        run: coverage run -a src/manage.py test src --tag=playwright
        env:
          DJANGO_SETTINGS_MODULE: objects.conf.ci
          DEBUG: 'true'
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_PASSWORD: ''
          DB_POOL_ENABLED: ${{ matrix.use_pooling }}
          CELERY_BROKER_URL: 'redis://localhost:6379/0'
          CELERY_ONCE_REDIS_URL: 'redis://localhost:6379/0'

      - name: Publish coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  performance-tests:
    name: Run the performance test suite
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write  # to add comments to the PR
      checks: write

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages: "gdal-bin postgresql-client"
          python-version: "3.12"
          optimize-postgres: "no"
          setup-node: "no"

      - name: Set up uWSGI and generate data
        run: |
          createdb -h localhost -U postgres objects
          pip install uv
          uv pip install -r requirements/ci.txt
          src/manage.py migrate
          SCRIPTPATH=bin UWSGI_PROCESSES=4 UWSGI_THREADS=4 bin/docker_start.sh &
          src/manage.py shell < performance_test/create_data.py
        env:
          RUN_SETUP_CONFIG: false
          DB_PASSWORD: ""
          DB_USER: postgres
          DB_NAME: objects
          DB_HOST: localhost
          SECRET_KEY: secret
          DJANGO_SETTINGS_MODULE: objects.conf.production
          SITE_DOMAIN: localhost:8000
          ALLOWED_HOSTS: localhost,127.0.0.1
          FUZZY_PAGINATION: true
          DB_CONN_MAX_AGE: 60

      - name: Install dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://bencher.dev/download/install-cli.sh | sh
          pip install uv
          pkgs=$(cat requirements/performance-tests.in)
          grep -E "^($(echo $pkgs | sed 's/ /|/g'))([=<>]|$)" requirements/ci.txt | xargs uv pip install

      - run: uv pip install locust

      - name: Run Locust tests
        run: |
          python -m locust --config performance_test/locust/locust.conf

      - name: Run tests for master branch
        if: github.ref == 'refs/heads/master'
        run: |
          bencher run --adapter python_pytest \
                      --project objects-ed2ce35-z71n5gf8t4f40 \
                      --key '${{ secrets.BENCHER_API_TOKEN }}' \
                      --branch master \
                      --testbed ubuntu-24.04 \
                      --average median \
                      --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                      --file output.json \
                      "pytest performance_test/tests/ --benchmark-warmup=on --benchmark-warmup-iterations=5 --benchmark-json output.json"

      - name: Run tests for other branches
        if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/')
        run: |
          bencher run --adapter python_pytest \
                      --project objects-ed2ce35-z71n5gf8t4f40 \
                      --key '${{ secrets.BENCHER_API_TOKEN }}' \
                      --branch "$GITHUB_HEAD_REF" \
                      --start-point "$GITHUB_BASE_REF" \
                      --start-point-max-versions 30 \
                      --average median \
                      --threshold-measure latency \
                      --threshold-test iqr \
                      --threshold-upper-boundary 2.0 \
                      --threshold-min-sample-size 15 \
                      --testbed ubuntu-24.04 \
                      --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                      --file output.json \
                      "pytest performance_test/tests/ --benchmark-warmup=on --benchmark-warmup-iterations=5 --benchmark-json output.json"

  store-reusable-workflow-vars:
    name: create values which can be passed through a reusable workflow
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.image-name.outputs.image-name }}

    steps:
      - run: echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
        name: 'Store the docker image name'
        id: image-name

  open-api-ci:
    uses: maykinmedia/open-api-workflows/.github/workflows/ci.yml@0a5525c13f8eea10be40c8eaee5e535ea3a10721 # v6.4.1
    needs:
      - store-reusable-workflow-vars
    permissions:
      contents: read
      security-events: write  # required for `Scan docker image` step
    with:
      main-branch: 'master'
      apt-packages: 'gdal-bin graphviz graphviz-dev'
      run-docs: true
      django-settings-module: objects.conf.ci
      python-version: '3.12'
      docker-image-name: ${{ needs.store-reusable-workflow-vars.outputs.image-name }}

  open-api-publish:
    uses: maykinmedia/open-api-workflows/.github/workflows/publish.yml@0a5525c13f8eea10be40c8eaee5e535ea3a10721 # v6.4.1
    needs:
      - store-reusable-workflow-vars
      - open-api-ci
      - tests
    with:
      docker-image-name: ${{ needs.store-reusable-workflow-vars.outputs.image-name }}
      repository-owner: 'maykinmedia'
    secrets:
      docker-username: ${{ secrets.DOCKER_USERNAME }}
      docker-token: ${{ secrets.DOCKER_TOKEN }}
