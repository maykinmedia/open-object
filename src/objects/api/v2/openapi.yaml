components:
  schemas:
    BehoudenResponse:
      type: object
      properties:
        behouden:
          type: array
          items:
            type: string
            format: uri
          description: Kept OBJECT URLs
      required:
      - behouden
    DataClassificationEnum:
      enum:
      - open
      - intern
      - confidential
      - strictly_confidential
      type: string
      description: |-
        * `open` - Open
        * `intern` - Intern
        * `confidential` - Confidential
        * `strictly_confidential` - Strictly confidential
    GeoJSONGeometry:
      title: GeoJSONGeometry
      type: object
      oneOf:
      - $ref: '#/components/schemas/Point'
      - $ref: '#/components/schemas/MultiPoint'
      - $ref: '#/components/schemas/LineString'
      - $ref: '#/components/schemas/MultiLineString'
      - $ref: '#/components/schemas/Polygon'
      - $ref: '#/components/schemas/MultiPolygon'
      - $ref: '#/components/schemas/GeometryCollection'
      discriminator:
        propertyName: type
    GeoWithin:
      type: object
      properties:
        within:
          $ref: '#/components/schemas/GeoJSONGeometry'
    Geometry:
      type: object
      title: Geometry
      description: GeoJSON geometry
      required:
      - type
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/GeometryTypeEnum'
          description: The geometry type
    GeometryCollection:
      type: object
      description: GeoJSON geometry collection
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.8
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - geometries
        properties:
          geometries:
            type: array
            items:
              $ref: '#/components/schemas/Geometry'
    GeometryTypeEnum:
      type: string
      enum:
      - Point
      - MultiPoint
      - LineString
      - MultiLineString
      - Polygon
      - MultiPolygon
      - Feature
      - FeatureCollection
      - GeometryCollection
    HistoryRecord:
      type: object
      properties:
        index:
          type: integer
          readOnly: true
          description: Incremental index number of the object record.
        typeVersion:
          type: integer
          maximum: 32767
          minimum: 0
          description: Version of the OBJECTTYPE for data in the object record
        data:
          type: object
          additionalProperties: true
          description: Object data, based on OBJECTTYPE
        geometry:
          allOf:
          - $ref: '#/components/schemas/GeoJSONGeometry'
          nullable: true
          description: Point, linestring or polygon object which represents the coordinates
            of the object. Geometry can be added only if the related OBJECTTYPE allows
            this (`OBJECTTYPE.allowGeometry = true` or `OBJECTTYPE.allowGeometry`
            doesn't exist)
        startAt:
          type: string
          format: date
          description: Legal start date of the object record
        endAt:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Legal end date of the object record
        registrationAt:
          type: string
          format: date
          readOnly: true
          description: The date when the record was registered in the system
        correctionFor:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Index of the record corrected by the current record
          readOnly: true
        correctedBy:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Index of the record, which corrects the current record
          readOnly: true
      required:
      - startAt
      - typeVersion
    LineString:
      type: object
      description: GeoJSON line-string geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.4
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'
            minItems: 2
    ModeEnum:
      enum:
      - read_only
      - read_and_write
      type: string
      description: |-
        * `read_only` - Read-only
        * `read_and_write` - Read and write
    MultiLineString:
      type: object
      description: GeoJSON multi-line-string geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.5
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Point2D'
    MultiPoint:
      type: object
      description: GeoJSON multi-point geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.3
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              $ref: '#/components/schemas/Point2D'
    MultiPolygon:
      type: object
      description: GeoJSON multi-polygon geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.7
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Point2D'
    Object:
      type: object
      description: |-
        this mixin allows selecting fields for serializer in the query param
        It also supports nested fields.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
        uuid:
          type: string
          format: uuid
          description: Unique identifier (UUID4)
        type:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: Url reference to OBJECTTYPE
        record:
          allOf:
          - $ref: '#/components/schemas/ObjectRecord'
          description: State of the OBJECT at a certain time
      required:
      - record
      - type
    ObjectRecord:
      type: object
      properties:
        index:
          type: integer
          readOnly: true
          description: Incremental index number of the object record.
        typeVersion:
          type: integer
          maximum: 32767
          minimum: 0
          description: Version of the OBJECTTYPE for data in the object record
        data:
          type: object
          additionalProperties: true
          description: Object data, based on OBJECTTYPE
        geometry:
          allOf:
          - $ref: '#/components/schemas/GeoJSONGeometry'
          nullable: true
          description: Point, linestring or polygon object which represents the coordinates
            of the object. Geometry can be added only if the related OBJECTTYPE allows
            this (`OBJECTTYPE.allowGeometry = true` or `OBJECTTYPE.allowGeometry`
            doesn't exist)
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
          default: []
        startAt:
          type: string
          format: date
          description: Legal start date of the object record
        endAt:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Legal end date of the object record
        registrationAt:
          type: string
          format: date
          readOnly: true
          description: The date when the record was registered in the system
        correctionFor:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Index of the record corrected by the current record
          nullable: true
        correctedBy:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Index of the record, which corrects the current record
          readOnly: true
      required:
      - startAt
      - typeVersion
    ObjectSearch:
      type: object
      properties:
        geometry:
          $ref: '#/components/schemas/GeoWithin'
    ObjectType:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
        uuid:
          type: string
          format: uuid
          description: Unique identifier (UUID4)
        name:
          type: string
          description: Name of the object type
          maxLength: 100
        namePlural:
          type: string
          description: Plural name of the object type
          maxLength: 100
        description:
          type: string
          description: The description of the object type
          maxLength: 1000
        dataClassification:
          allOf:
          - $ref: '#/components/schemas/DataClassificationEnum'
          description: |-
            Confidential level of the object type

            * `open` - Open
            * `intern` - Intern
            * `confidential` - Confidential
            * `strictly_confidential` - Strictly confidential
        maintainerOrganization:
          type: string
          description: Organization which is responsible for the object type
          maxLength: 200
        maintainerDepartment:
          type: string
          description: Business department which is responsible for the object type
          maxLength: 200
        contactPerson:
          type: string
          description: Name of the person in the organization who can provide information
            about the object type
          maxLength: 200
        contactEmail:
          type: string
          description: Email of the person in the organization who can provide information
            about the object type
          maxLength: 200
        source:
          type: string
          description: Name of the system from which the object type originates
          maxLength: 200
        updateFrequency:
          allOf:
          - $ref: '#/components/schemas/UpdateFrequencyEnum'
          description: |-
            Indicates how often the object type is updated

            * `real_time` - Real-time
            * `hourly` - Hourly
            * `daily` - Daily
            * `weekly` - Weekly
            * `monthly` - Monthly
            * `yearly` - Yearly
            * `unknown` - Unknown
        providerOrganization:
          type: string
          description: Organization which is responsible for publication of the object
            type
          maxLength: 200
        documentationUrl:
          type: string
          format: uri
          description: Link to the documentation for the object type
          maxLength: 200
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of keywords related for the object type
        createdAt:
          type: string
          format: date
          readOnly: true
          description: Date when the object type was created
        modifiedAt:
          type: string
          format: date
          readOnly: true
          description: Last date when the object type was modified
        allowGeometry:
          type: boolean
          description: 'Shows whether the related objects can have geographic coordinates.
            If the value is ''false'' the related objects are not allowed to have
            coordinates and the creation/update of objects with `geometry` property
            will raise an error '
        versions:
          type: array
          items:
            type: string
            format: uri
            minLength: 1
            maxLength: 1000
          readOnly: true
          description: list of URLs for the OBJECTTYPE versions
      required:
      - name
      - namePlural
    ObjectTypeVersion:
      type: object
      description: |-
        A type of `ModelSerializer` that uses hyperlinked relationships with compound keys instead
        of primary key relationships.  Specifically:

        * A 'url' field is included instead of the 'id' field.
        * Relationships to other instances are hyperlinks, instead of primary keys.

        NOTE: this only works with DRF 3.1.0 and above.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: Integer version of the OBJECTTYPE
        objectType:
          type: string
          format: uri
