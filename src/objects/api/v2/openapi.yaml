    PatchedObject:
      type: object
      description: |-
        this mixin allows selecting fields for serializer in the query param
        It also supports nested fields.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
        uuid:
          type: string
          format: uuid
          description: Unique identifier (UUID4)
        type:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: Url reference to OBJECTTYPE
        record:
          allOf:
          - $ref: '#/components/schemas/ObjectRecord'
          description: State of the OBJECT at a certain time
    PatchedObjectType:
      type: object
      properties:
        url:
          type: string
          format: uri
          readOnly: true
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
        uuid:
          type: string
          format: uuid
          description: Unique identifier (UUID4)
        name:
          type: string
          description: Name of the object type
          maxLength: 100
        namePlural:
          type: string
          description: Plural name of the object type
          maxLength: 100
        description:
          type: string
          description: The description of the object type
          maxLength: 1000
        dataClassification:
          allOf:
          - $ref: '#/components/schemas/DataClassificationEnum'
          description: |-
            Confidential level of the object type

            * `open` - Open
            * `intern` - Intern
            * `confidential` - Confidential
            * `strictly_confidential` - Strictly confidential
        maintainerOrganization:
          type: string
          description: Organization which is responsible for the object type
          maxLength: 200
        maintainerDepartment:
          type: string
          description: Business department which is responsible for the object type
          maxLength: 200
        contactPerson:
          type: string
          description: Name of the person in the organization who can provide information
            about the object type
          maxLength: 200
        contactEmail:
          type: string
          description: Email of the person in the organization who can provide information
            about the object type
          maxLength: 200
        source:
          type: string
          description: Name of the system from which the object type originates
          maxLength: 200
        updateFrequency:
          allOf:
          - $ref: '#/components/schemas/UpdateFrequencyEnum'
          description: |-
            Indicates how often the object type is updated

            * `real_time` - Real-time
            * `hourly` - Hourly
            * `daily` - Daily
            * `weekly` - Weekly
            * `monthly` - Monthly
            * `yearly` - Yearly
            * `unknown` - Unknown
        providerOrganization:
          type: string
          description: Organization which is responsible for publication of the object
            type
          maxLength: 200
        documentationUrl:
          type: string
          format: uri
          description: Link to the documentation for the object type
          maxLength: 200
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs of keywords related for the object type
        createdAt:
          type: string
          format: date
          readOnly: true
          description: Date when the object type was created
        modifiedAt:
          type: string
          format: date
          readOnly: true
          description: Last date when the object type was modified
        allowGeometry:
          type: boolean
          description: 'Shows whether the related objects can have geographic coordinates.
            If the value is ''false'' the related objects are not allowed to have
            coordinates and the creation/update of objects with `geometry` property
            will raise an error '
        versions:
          type: array
          items:
            type: string
            format: uri
            minLength: 1
            maxLength: 1000
          readOnly: true
          description: list of URLs for the OBJECTTYPE versions
    PatchedObjectTypeVersion:
      type: object
      description: |-
        A type of `ModelSerializer` that uses hyperlinked relationships with compound keys instead
        of primary key relationships.  Specifically:

        * A 'url' field is included instead of the 'id' field.
        * Relationships to other instances are hyperlinks, instead of primary keys.

        NOTE: this only works with DRF 3.1.0 and above.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: Integer version of the OBJECTTYPE
        objectType:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: URL reference to this object. This is the unique identification
            and location of this object.
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status of the object type version

            * `published` - Published
            * `draft` - Draft
            * `deprecated` - Deprecated
        jsonSchema:
          type: object
          additionalProperties: true
          title: JSON schema
          description: JSON schema for Object validation
        createdAt:
          type: string
          format: date
          readOnly: true
          description: Date when the version was created
        modifiedAt:
          type: string
          format: date
          readOnly: true
          description: Last date when the version was modified
        publishedAt:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Published_at
          description: Date when the version was published
    Permission:
      type: object
      properties:
        type:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: Url reference to OBJECTTYPE
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            Permission mode

            * `read_only` - Read-only
            * `read_and_write` - Read and write
        use_fields:
          type: boolean
          description: Use field-based authorization
        fields:
          type: object
          additionalProperties: true
          nullable: true
          title: Mode
          description: Fields allowed for this token in relation to objecttype versions.
            Supports only first level of the `record.data` properties
      required:
      - mode
      - type
    Point:
      type: object
      description: GeoJSON point geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.2
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            $ref: '#/components/schemas/Point2D'
    Point2D:
      type: array
      title: Point2D
      description: A 2D point
      items:
        type: number
      maxItems: 2
      minItems: 2
    Polygon:
      type: object
      description: GeoJSON polygon geometry
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.1.6
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        required:
        - coordinates
        properties:
          coordinates:
            type: array
            items:
              type: array
              items:
                $ref: '#/components/schemas/Point2D'
    Reference:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ReferenceTypeEnum'
        url:
          type: string
          format: uri
          maxLength: 200
      required:
      - type
      - url
    ReferenceTypeEnum:
      enum:
