[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
reportUnnecessaryTypeIgnoreComment = "error"
include = [
    "src/objects/utils",
    "src/objects/accounts",
]
exclude = [
    "src/objects/conf/dev.py",
    "src/objects/**/migrations",
    "src/objects/**/tests",
    "src/objects/**/management",
]